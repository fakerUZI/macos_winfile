<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WinFile · macOS 文件管理器</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app" class="app">

  <!-- 窗口标题栏 -->
  <header class="titlebar">
    <div class="titlebar__icon">🗂️</div>
    <div class="titlebar__title" id="windowTitle">WinFile</div>
    <div class="titlebar__spacer"></div>
    <div class="titlebar__badge" id="engineBadge" title="数据来源：Spotlight 索引 / 本地目录扫描">引擎就绪</div>
  </header>

  <!-- 命令栏 -->
  <div class="commandbar">
    <div class="cmdgroup">
      <button class="cmd" id="btnNew" title="新建 (Ctrl+Shift+N)">
        <span class="cmd__glyph">🗋</span><span class="cmd__label">新建</span><span class="cmd__caret">▾</span>
      </button>
      <div class="cmdgroup__sep"></div>
      <button class="cmd" id="btnCut" title="剪切 (Ctrl+X)" disabled><span class="cmd__glyph">✂</span><span class="cmd__label">剪切</span></button>
      <button class="cmd" id="btnCopy" title="复制 (Ctrl+C)" disabled><span class="cmd__glyph">⧉</span><span class="cmd__label">复制</span></button>
      <button class="cmd" id="btnPaste" title="粘贴 (Ctrl+V)" disabled><span class="cmd__glyph">📋</span><span class="cmd__label">粘贴</span></button>
      <button class="cmd" id="btnCopyPath" title="复制路径/文件名/内容到系统剪贴板" disabled><span class="cmd__glyph">🔗</span><span class="cmd__label">复制为</span><span class="cmd__caret">▾</span></button>
      <button class="cmd" id="btnRename" title="重命名 (F2)" disabled><span class="cmd__glyph">✎</span><span class="cmd__label">重命名</span></button>
      <button class="cmd" id="btnDelete" title="删除到废纸篓 (Delete)" disabled><span class="cmd__glyph">🗑</span><span class="cmd__label">删除</span></button>
      <div class="cmdgroup__sep"></div>
      <button class="cmd" id="btnOpen" title="打开 (Enter)" disabled><span class="cmd__glyph">↗</span><span class="cmd__label">打开</span></button>
      <button class="cmd" id="btnReveal" title="在访达中显示" disabled><span class="cmd__glyph">🔍</span><span class="cmd__label">在访达中显示</span></button>
    </div>
    <div class="cmdgroup cmdgroup--right">
      <button class="cmd cmd--icon" id="btnSort" title="排序方式"><span class="cmd__glyph">⇅</span><span class="cmd__label">排序</span><span class="cmd__caret">▾</span></button>
      <button class="cmd cmd--icon" id="btnView" title="视图"><span class="cmd__glyph">▦</span><span class="cmd__label">视图</span><span class="cmd__caret">▾</span></button>
      <button class="cmd cmd--icon" id="btnDetails" title="显示/隐藏详细信息窗格"><span class="cmd__glyph">ⓘ</span><span class="cmd__label">详细信息</span></button>
    </div>
  </div>

  <!-- 地址栏 -->
  <div class="addressbar">
    <div class="navbtns">
      <button class="navbtn" id="btnBack" title="后退 (Alt+←)" disabled>←</button>
      <button class="navbtn" id="btnForward" title="前进 (Alt+→)" disabled>→</button>
      <button class="navbtn" id="btnUp" title="上一级 (Alt+↑)">↑</button>
      <button class="navbtn" id="btnRefresh" title="刷新 (F5)">⟳</button>
    </div>
    <div class="address" id="addressWrap">
      <span class="address__icon" id="addressIcon">💽</span>
      <div class="crumbs" id="crumbs"></div>
      <input class="address__input" id="pathInput" spellcheck="false" autocomplete="off"
             placeholder="输入路径后回车，例如 ~/Documents 或 /Applications" />
      <button class="address__go" id="btnGo" title="跳转">转到</button>
      <div class="suggest" id="suggest" hidden></div>
    </div>
    <div class="search">
      <span class="search__icon">🔎</span>
      <input class="search__input" id="searchInput" placeholder="搜索当前视图" spellcheck="false" autocomplete="off" />
      <button class="search__clear" id="btnSearchClear" hidden>✕</button>
    </div>
  </div>

  <!-- 主体：导航窗格 / 内容 / 详细信息 -->
  <div class="body">
    <aside class="navpane" id="navpane">
      <div class="navpane__scroll" id="navScroll">
        <div id="navTree"></div>
        <div class="navsection">
          <div class="navsection__head">分类</div>
          <div id="categoryList" class="navlist"></div>
        </div>
        <div class="navsection">
          <div class="navsection__head">此电脑</div>
          <div id="volumeList" class="navlist"></div>
        </div>
      </div>
      <div class="navpane__foot">
        <button class="linkbtn" id="btnShowHidden">显示隐藏文件：关</button>
      </div>
    </aside>

    <main class="content" id="content">
      <div class="tabstrip" id="tabStrip"></div>
      <div class="viewhost" id="viewHost">
        <div class="empty" id="emptyState" hidden>
          <div class="empty__icon">📂</div>
          <div class="empty__title" id="emptyTitle">此文件夹为空</div>
          <div class="empty__hint" id="emptyHint"></div>
        </div>
        <div class="loading" id="loading" hidden><div class="spinner"></div><span id="loadingText">正在读取…</span></div>
        <div id="listView" class="listview"></div>
        <div id="tileView" class="tileview" hidden></div>
      </div>
    </main>

    <aside class="detailpane" id="detailpane">
      <div class="detailpane__head" id="detailHead">详细信息</div>
      <div class="detailpane__body" id="detailBody"></div>
    </aside>
  </div>

  <!-- 状态栏 -->
  <footer class="statusbar">
    <span id="statusCount">就绪</span>
    <span class="statusbar__sep">|</span>
    <span id="statusSel"></span>
    <span class="statusbar__spacer"></span>
    <span id="statusDisk"></span>
    <span class="statusbar__sep">|</span>
    <span id="statusSource"></span>
  </footer>
</div>

<!-- 右键菜单 -->
<div class="ctxmenu" id="ctxMenu" hidden></div>
<!-- 对话框 -->
<div class="dialog__backdrop" id="dialogBackdrop" hidden>
  <div class="dialog" id="dialog">
    <div class="dialog__title" id="dialogTitle">标题</div>
    <div class="dialog__body" id="dialogBody"></div>
    <div class="dialog__foot">
      <button class="btn btn--ghost" id="dialogCancel">取消</button>
      <button class="btn btn--primary" id="dialogOk">确定</button>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script src="/js/app.js" type="module"></script>
</body>
</html>
