name: Deploy product website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tools/build_website.py'
      - 'native/Info.plist'
      - 'docs/screenshots/*.png'
      - 'docs/icon/AppIcon-1024.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build and validate static website
        run: python3 tools/build_website.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site-build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
